<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>영은이와 든이의 결혼식</title>

  <meta property="og:title" content="영은이와 든이의 결혼식">
  <meta property="og:description" content="소중한 분들을 초대합니다">
  <meta property="og:image" content="">
  <meta property="og:url" content="">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background: #f8f5f0;
      color: #333;
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: #fff;
      text-align: center;
    }

    .hero {
      padding: 80px 24px 60px;
      background: #f3eee7;
    }

    .small {
      font-size: 14px;
      letter-spacing: 3px;
      color: #9a8f83;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 28px;
      font-weight: 400;
      line-height: 1.5;
      margin: 0;
    }

    .date {
      margin-top: 32px;
      font-size: 16px;
      line-height: 1.8;
    }

    .section {
      padding: 56px 24px;
    }

    .section h2 {
      font-size: 18px;
      font-weight: 400;
      margin-bottom: 24px;
    }

    .section p {
      font-size: 15px;
      line-height: 1.9;
      margin: 0;
    }

    .info {
      background: #faf8f5;
    }

    .button {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 1px solid #d7cfc4;
      color: #333;
      text-decoration: none;
      font-size: 14px;
      border-radius: 6px;
      background: #fff;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <section class="hero">
      <div class="small">WEDDING INVITATION</div>
      <h1>
        영은이와 든이<br>
        결혼합니다
      </h1>
      <div class="date">
        2026.00.00 SAT 00:00<br>
        예식장 이름 / 홀 이름
      </div>
    </section>

    <section class="section">
      <h2>초대합니다</h2>
      <p>
        서로의 가장 좋은 친구가 되어<br>
        같은 방향을 바라보며 걸어가려 합니다.<br>
        소중한 분들을 모시고<br>
        저희의 첫 시작을 함께 나누고 싶습니다.
      </p>
    </section>

    <section class="section info">
      <h2>예식 안내</h2>
      <p>
        2026년 00월 00일 토요일 00시 00분<br>
        예식장 이름<br>
        홀 이름
      </p>

      <a class="button" href="#" target="_blank">지도 보기</a>
      <a class="button" href="tel:01000000000">연락하기</a>
    </section>
  </div>
</body>
</html>
